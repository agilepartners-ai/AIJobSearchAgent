steps:
  # Build the Docker image with build arguments
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_JSEARCH_API_KEY=${_NEXT_PUBLIC_JSEARCH_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_JSEARCH_API_HOST=${_NEXT_PUBLIC_JSEARCH_API_HOST}'
      - '--build-arg'
      - 'NEXT_PUBLIC_TAVUS_API_KEY=${_NEXT_PUBLIC_TAVUS_API_KEY}'
      - '-t'
      - '${_GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-f'
      - 'ci-cd-cloudrun/Dockerfile'
      - '.'
    id: 'build-image'

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
    id: 'push-image'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_GAR_LOCATION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # --update-* merges rather than replacing, so anything configured directly
      # on the service is preserved across deploys.
      - '--update-env-vars'
      - 'PORT=8080'
      # Server-side secrets. These are read at request time by the document
      # generation routes and must NEVER be build args — baking them into the
      # image would expose them to anyone who can pull it.
      #
      # Requires these Secret Manager secrets to exist, and the Cloud Run
      # service account to hold roles/secretmanager.secretAccessor:
      #   gemini-api-key, texapi-key,
      #   database-url, pg-ssl-ca, document-signing-secret
      - '--update-secrets'
      - 'GEMINI_API_KEY=gemini-api-key:latest,TEXAPI_KEY=texapi-key:latest,DATABASE_URL=database-url:latest,PG_SSL_CA=pg-ssl-ca:latest,DOCUMENT_SIGNING_SECRET=document-signing-secret:latest'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      # Generation is Gemini + two LaTeX compiles, plus a possible 20s
      # rate-limit re-check and one regeneration retry. 300s was too tight.
      - '--timeout'
      - '600'
    id: 'deploy-to-cloudrun'

# Substitution variables (can be overridden in trigger or command line)
substitutions:
  _GAR_LOCATION: ''
  _REPOSITORY: ''
  _SERVICE_NAME: ''
  # Environment variables for build and runtime
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  _NEXT_PUBLIC_JSEARCH_API_KEY: ''
  _NEXT_PUBLIC_JSEARCH_API_HOST: ''
  _NEXT_PUBLIC_TAVUS_API_KEY: ''


# Configure build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'

# Build timeout
timeout: '1200s'
