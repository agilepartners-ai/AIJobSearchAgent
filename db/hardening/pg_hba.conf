# Installed on the VM at ~/notera/pgconf/pg_hba.conf and loaded with `-c hba_file=/pgconf/pg_hba.conf`.
# Order matters: first match wins.
#
# Goal: publishing 5432 for Netlify must NOT expose Notera's PHI database.
#   - `notera` DB    : only from inside the container and the private compose network (172.18.0.0/16)
#   - `jobsearch` DB : from the internet, only as jobsearch_app, only over TLS + SCRAM
#
# TYPE      DATABASE     USER            ADDRESS            METHOD
# inside the container (docker exec psql, healthchecks) — same as the stock image
local       all          all                                trust
host        all          all             127.0.0.1/32       trust
host        all          all             ::1/128            trust

# Notera backend over the private compose network (notera_notera_net = 172.18.0.0/16)
host        all          all             172.18.0.0/16      scram-sha-256

# Public path for the Netlify app: TLS required (hostssl), one role, one database.
hostssl     jobsearch    jobsearch_app   0.0.0.0/0          scram-sha-256

# Everything else from anywhere is refused (including non-TLS and any other DB/role).
host        all          all             0.0.0.0/0          reject
host        all          all             ::/0               reject
